[project]
name = "duecourse"
version = "0.1.0"
description = "Filing-deadline triage and human-approved chasing-email drafts for a UK accountancy practice. Never sends."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "pydantic-ai>=0.1",
    "httpx>=0.27",
    "tenacity>=9.0",
    "streamlit>=1.38",
    "apscheduler>=3.10",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "typer>=0.12",
]

[project.optional-dependencies]
# The guidance-RAG stack pulls in torch via sentence-transformers; optional so the default
# reviewer run stays a small, fast install. Cited drafts need: uv sync --extra rag
rag = [
    "lancedb>=0.15",
    "sentence-transformers>=3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "respx>=0.21",
    "freezegun>=1.5",
    "ruff>=0.6",
]

[project.scripts]
duecourse = "duecourse.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/duecourse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["live: hits the live Companies House API (excluded by default and in CI)"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
