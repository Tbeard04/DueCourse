name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 02-solution
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install dependencies (slim — RAG tests skip without lancedb)
        run: uv sync --no-group rag
      - name: Keep uv run from re-syncing the full group set
        run: echo "UV_NO_SYNC=1" >> "$GITHUB_ENV"
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Tests (offline only — live-API tests are excluded by marker)
        run: uv run pytest
