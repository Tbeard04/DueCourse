name: Publish weekly digest

on:
  schedule:
    - cron: "30 7 * * 1" # Mondays 07:30 UTC (07:30 GMT / 08:30 BST)
  workflow_dispatch: {} # manual runs from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CH_API_KEY: ${{ secrets.CH_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install (slim — the digest is deterministic, no LLM or RAG needed)
        run: uv sync --no-group rag
        working-directory: 02-solution
      - name: Keep uv run from re-adding the rag group
        run: echo "UV_NO_SYNC=1" >> "$GITHUB_ENV"
      - name: Sync portfolio from the live register
        run: uv run duecourse sync
        working-directory: 02-solution
      - name: Triage
        run: uv run duecourse triage
        working-directory: 02-solution
      - name: Export digest data for the frontend
        run: uv run python scripts/export_digest_data.py
        working-directory: 02-solution
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: 02-solution/web/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: 02-solution/web
      - name: Build the static site (Next.js export)
        run: npm run build
        working-directory: 02-solution/web
        env:
          PAGES_BASE_PATH: /DueCourse # project sites are served under /<repo>
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: 02-solution/web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
